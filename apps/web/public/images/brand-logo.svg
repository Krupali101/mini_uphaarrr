<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Mini Uphaarrr logo</title>
  <desc id="desc">Round peach Mini Uphaarrr brand logo with bow and crafted by K text.</desc>
